<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="50%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#140f2d" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Subtle Inner Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Container with Glow -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#innerGlow)" />

  <!-- Code Tag < -->
  <path d="M 19 25 L 13 32 L 19 39" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram R -->
  <!-- Vertical stem -->
  <path d="M 27 21 L 27 43" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
  <!-- Upper loop -->
  <path d="M 27 21 H 34 C 38 21 40 23.5 40 27 C 40 30.5 38 33 34 33 H 27" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Diagonal leg -->
  <path d="M 33 33 L 40 43" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Code Tag /> -->
  <!-- Slash -->
  <path d="M 45 38 L 48 26" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
  <!-- Bracket > -->
  <path d="M 47 25 L 53 32 L 47 39" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Active Status Indicator Dot (Emerald Green Beacon) -->
  <circle cx="53" cy="11" r="5" fill="#10b981" stroke="#070c18" stroke-width="2" />
  <circle cx="53" cy="11" r="2" fill="#a7f3d0" />
</svg>
